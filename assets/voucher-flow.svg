<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="laundryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="boxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F43F5E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#laundryBg)"/>

  <!-- Top Title Bar -->
  <rect x="25" y="20" width="550" height="40" rx="8" fill="#141E33" stroke="#253556" stroke-width="1"/>
  <text x="45" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">OPERATIONAL BOTTLENECK VS. VOUCHER QUEUING RE-ENGINEERING</text>
  <rect x="475" y="28" width="85" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <text x="517" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399">-70% Latency</text>

  <!-- Problem Side (Before) -->
  <g transform="translate(30, 80)">
    <rect width="250" height="245" rx="12" fill="#182030" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="15" y="15" width="220" height="26" rx="6" fill="#EF4444" fill-opacity="0.15"/>
    <text x="25" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#F87171">BEFORE: Manual Ledger Search</text>

    <!-- Node 1 -->
    <rect x="25" y="55" width="200" height="40" rx="6" fill="#0F172A" stroke="#374151"/>
    <text x="35" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#E2E8F0">Student Claims Change</text>
    <text x="35" y="87" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">Verbal name &amp; date inquiry</text>

    <path d="M 125 95 V 110" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Node 2 Bottleneck -->
    <rect x="25" y="112" width="200" height="48" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
    <text x="35" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FCA5A5">⚠️ Bottleneck: Manual Log Search</text>
    <text x="35" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#FECDD3">Flipping 100+ handwritten pages (3-5 min)</text>

    <path d="M 125 160 V 175" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Node 3 -->
    <rect x="25" y="177" width="200" height="42" rx="6" fill="#0F172A" stroke="#374151"/>
    <text x="35" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#E2E8F0">Discrepancy &amp; Student Queues</text>
    <text x="35" y="209" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F87171">High Error Rate &amp; 15+ Min Queue</text>
  </g>

  <!-- Process Re-engineering Arrow -->
  <g transform="translate(287, 185)">
    <circle cx="13" cy="13" r="16" fill="url(#roseAccent)" filter="url(#boxGlow)"/>
    <path d="M 8 13 H 18 M 14 9 L 18 13 L 14 17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Solution Side (After - Jia's Voucher Mechanism) -->
  <g transform="translate(320, 80)">
    <rect width="250" height="245" rx="12" fill="#182030" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="15" y="15" width="220" height="26" rx="6" fill="#10B981" fill-opacity="0.15"/>
    <text x="25" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#34D399">AFTER: Serialized Voucher Queuing</text>

    <!-- Node 1 -->
    <rect x="25" y="55" width="200" height="40" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="35" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#E2E8F0">Voucher Issued at Payment</text>
    <text x="35" y="87" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8">Unique Serial ID &amp; Amount Stamp</text>

    <path d="M 125 95 V 110" stroke="#10B981" stroke-width="1.5"/>

    <!-- Node 2 Innovation -->
    <rect x="25" y="112" width="200" height="48" rx="6" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="35" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#A7F3D0">✨ Instant 1-to-1 Index Matching</text>
    <text x="35" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#D1FAE5">Direct slot lookup (&lt; 15 seconds)</text>

    <path d="M 125 160 V 175" stroke="#10B981" stroke-width="1.5"/>

    <!-- Node 3 -->
    <rect x="25" y="177" width="200" height="42" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="35" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#E2E8F0">Voucher Reconciled &amp; Archived</text>
    <text x="35" y="209" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">0 Ledger Mismatches &amp; Smooth Flow</text>
  </g>
</svg>
