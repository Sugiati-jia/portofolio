<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="siakadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#siakadBg)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 0 60 H 600 M 0 120 H 600 M 0 180 H 600 M 0 240 H 600 M 0 300 H 600" stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3"/>
  <path d="M 100 0 V 360 M 200 0 V 360 M 300 0 V 360 M 400 0 V 360 M 500 0 V 360" stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- Top Browser / UI Bar -->
  <rect x="25" y="25" width="550" height="310" rx="12" fill="#111827" stroke="#374151" stroke-width="1" filter="url(#cardShadow)"/>
  
  <circle cx="45" cy="45" r="5" fill="#EF4444"/>
  <circle cx="60" cy="45" r="5" fill="#F59E0B"/>
  <circle cx="75" cy="45" r="5" fill="#10B981"/>
  <rect x="100" y="38" width="220" height="15" rx="7" fill="#1F2937"/>
  <text x="110" y="49" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">siakad.nuruljadid.ac.id/e-rapor</text>
  <rect x="490" y="37" width="70" height="16" rx="8" fill="#F43F5E" fill-opacity="0.2"/>
  <text x="525" y="49" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#FB7185">PWA ACTIVE</text>

  <!-- Left Sidebar (Navigation) -->
  <rect x="25" y="65" width="120" height="270" fill="#0B0F17" stroke="#1F2937" stroke-width="1"/>
  <rect x="35" y="80" width="100" height="12" rx="4" fill="url(#roseAccent)" fill-opacity="0.8"/>
  <text x="45" y="89" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">Kurikulum Merdeka</text>
  <rect x="35" y="105" width="80" height="8" rx="3" fill="#374151"/>
  <rect x="35" y="125" width="90" height="8" rx="3" fill="#374151"/>
  <rect x="35" y="145" width="70" height="8" rx="3" fill="#374151"/>
  <rect x="35" y="165" width="85" height="8" rx="3" fill="#374151"/>
  <rect x="35" y="270" width="100" height="40" rx="6" fill="#1E293B"/>
  <text x="42" y="286" font-family="'JetBrains Mono', monospace" font-size="7" fill="#F43F5E">SYNC STATUS</text>
  <text x="42" y="299" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#10B981">Offline Ready (0ms)</text>

  <!-- Right Content Area (Dashboard & ERD Node Mockup) -->
  <!-- Stats Header -->
  <rect x="160" y="80" width="120" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="172" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Total Siswa Aktif</text>
  <text x="172" y="118" font-family="'Playfair Display', serif" font-size="18" font-weight="bold" fill="#FFFFFF">1,248</text>

  <rect x="295" y="80" width="120" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="307" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Modul e-Rapor</text>
  <text x="307" y="118" font-family="'Playfair Display', serif" font-size="18" font-weight="bold" fill="#FB7185">Fase A - F</text>

  <rect x="430" y="80" width="130" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="442" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Service Worker Sync</text>
  <text x="442" y="118" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#38BDF8">IndexedDB</text>

  <!-- Central ERD & Architecture Flow Diagram Preview -->
  <g transform="translate(160, 145)">
    <rect width="400" height="170" rx="8" fill="#141E33" stroke="#253556" stroke-width="1"/>
    
    <!-- Table 1: Siswa -->
    <rect x="15" y="20" width="105" height="130" rx="6" fill="#0F172A" stroke="#FB7185" stroke-width="1.2"/>
    <rect x="15" y="20" width="105" height="24" rx="6" fill="#F43F5E"/>
    <text x="25" y="36" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF">tb_siswa</text>
    <text x="25" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F43F5E">PK  nisn</text>
    <text x="25" y="74" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">    nama_siswa</text>
    <text x="25" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">    kelas_id</text>
    <text x="25" y="106" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">    fase_merdeka</text>
    <text x="25" y="122" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">    created_at</text>

    <!-- Table 2: Capaian Pembelajaran -->
    <rect x="150" y="20" width="120" height="130" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="150" y="20" width="120" height="24" rx="6" fill="#0284C7"/>
    <text x="160" y="36" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF">tb_capaian_tp</text>
    <text x="160" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8">PK  id_tujuan</text>
    <text x="160" y="74" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">FK  mapel_id</text>
    <text x="160" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">    lingkup_materi</text>
    <text x="160" y="106" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">    deskripsi_tp</text>
    <text x="160" y="122" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">    bobot_asesmen</text>

    <!-- Table 3: e-Rapor Nilai Akhir -->
    <rect x="295" y="20" width="95" height="130" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
    <rect x="295" y="20" width="95" height="24" rx="6" fill="#059669"/>
    <text x="303" y="36" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF">tb_nilai_rapor</text>
    <text x="303" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10B981">PK  id_nilai</text>
    <text x="303" y="74" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">FK  nisn</text>
    <text x="303" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">FK  id_tujuan</text>
    <text x="303" y="106" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">    nilai_formatif</text>
    <text x="303" y="122" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0">    nilai_sumatif</text>

    <!-- Connecting Relationship Arrows -->
    <path d="M 120 74 C 135 74, 135 74, 150 74" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="2 2"/>
    <path d="M 270 74 C 282 74, 282 74, 295 74" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
</svg>
