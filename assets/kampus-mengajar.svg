<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="kmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="kmGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#kmBg)"/>

  <!-- Top Title -->
  <rect x="25" y="20" width="550" height="40" rx="8" fill="#141E33" stroke="#253556" stroke-width="1"/>
  <text x="45" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">KAMPUS MENGAJAR ANGKATAN 7 • SMPN 3 WONOMERTO</text>
  <rect x="460" y="28" width="100" height="24" rx="12" fill="#F43F5E" fill-opacity="0.2"/>
  <text x="510" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FB7185">LEAD SEC &amp; PUB</text>

  <!-- Left: Digital Literacy Workshops Card -->
  <g transform="translate(30, 80)">
    <rect width="255" height="245" rx="12" fill="#182030" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="225" height="30" rx="6" fill="#1E293B"/>
    <text x="25" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FB7185">Digital Literacy Curriculum</text>
    
    <!-- Item 1: MS Word Formatting -->
    <rect x="20" y="60" width="215" height="45" rx="6" fill="#0F172A" stroke="#2563EB" stroke-width="1"/>
    <circle cx="36" cy="82" r="10" fill="#1D4ED8"/>
    <text x="36" y="86" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">W</text>
    <text x="55" y="77" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">Advanced Documenting</text>
    <text x="55" y="93" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Report styles, automation &amp; layouts</text>

    <!-- Item 2: Canva Creative Design -->
    <rect x="20" y="115" width="215" height="45" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
    <circle cx="36" cy="137" r="10" fill="#0891B2"/>
    <text x="36" y="141" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">C</text>
    <text x="55" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">Visual Storytelling</text>
    <text x="55" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Infographics &amp; educational assets</text>

    <!-- Item 3: Institutional Impact -->
    <rect x="20" y="170" width="215" height="50" rx="6" fill="#1E293B"/>
    <text x="30" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#34D399">✓ 100% Student Participation</text>
    <text x="30" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Official institutional endorsement &amp; cert</text>
  </g>

  <!-- Right: Digital Media Publishing Showcase -->
  <g transform="translate(315, 80)">
    <rect width="255" height="245" rx="12" fill="#182030" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="225" height="30" rx="6" fill="#1E293B"/>
    <text x="25" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">School Media &amp; Campaign Branding</text>

    <!-- Social Media Mockup -->
    <rect x="20" y="60" width="215" height="110" rx="8" fill="#0F172A" stroke="#374151"/>
    
    <circle cx="40" cy="80" r="12" fill="#F43F5E"/>
    <text x="40" y="84" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">J</text>
    <text x="60" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0">smpn3wonomerto.official</text>
    <text x="60" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B">Published by Sugiati (Lead Doc)</text>

    <rect x="30" y="105" width="195" height="55" rx="6" fill="#1E293B"/>
    <text x="40" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#F1F5F9">Bulletin Literasi &amp; Prestasi 2024</text>
    <text x="40" y="142" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FB7185">#KampusMengajar #Kemendikbud</text>

    <!-- Key Metrics -->
    <rect x="20" y="180" width="102" height="42" rx="6" fill="#1E293B"/>
    <text x="30" y="196" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#F43F5E">50+</text>
    <text x="30" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Media Publications</text>

    <rect x="133" y="180" width="102" height="42" rx="6" fill="#1E293B"/>
    <text x="143" y="196" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#10B981">100%</text>
    <text x="143" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Report Compliance</text>
  </g>
