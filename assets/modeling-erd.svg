<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="modBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#modBg)"/>

  <!-- Top Title Bar -->
  <rect x="25" y="20" width="550" height="40" rx="8" fill="#141E33" stroke="#253556" stroke-width="1"/>
  <text x="45" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">UML ARCHITECTURE &amp; CONCEPTUAL / LOGICAL DATA MODELING (3NF)</text>
  <rect x="475" y="28" width="85" height="24" rx="12" fill="#38BDF8" fill-opacity="0.2"/>
  <text x="517" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#38BDF8">POWERDESIGNER</text>

  <!-- Left: UML Use Case & Sequence Overview -->
  <g transform="translate(30, 80)">
    <rect width="255" height="245" rx="12" fill="#182030" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="225" height="28" rx="6" fill="#1E293B"/>
    <text x="25" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FB7185">UML Diagrams Engineering</text>

    <!-- Actor Stick Figure -->
    <circle cx="45" cy="85" r="12" fill="none" stroke="#F43F5E" stroke-width="2"/>
    <path d="M 45 97 V 125 M 32 108 H 58 M 32 145 L 45 125 L 58 145" stroke="#F43F5E" stroke-width="2"/>
    <text x="45" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#F43F5E">Analyst/User</text>

    <!-- Use Cases Ellipses -->
    <ellipse cx="165" cy="80" rx="55" ry="16" fill="#0F172A" stroke="#FB7185" stroke-width="1.2"/>
    <text x="165" y="83" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#E2E8F0">&lt;&lt;extend&gt;&gt; Auth Flow</text>

    <ellipse cx="165" cy="120" rx="58" ry="16" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="165" y="123" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#E2E8F0">Process Optimization</text>

    <ellipse cx="165" cy="160" rx="58" ry="16" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
    <text x="165" y="163" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#E2E8F0">Export Structured Doc</text>

    <!-- Connecting lines -->
    <path d="M 60 110 L 110 80" stroke="#64748B" stroke-width="1.2"/>
    <path d="M 60 110 L 107 120" stroke="#64748B" stroke-width="1.2"/>
    <path d="M 60 110 L 110 160" stroke="#64748B" stroke-width="1.2"/>

    <!-- Bottom standard tag -->
    <rect x="20" y="195" width="215" height="32" rx="6" fill="#1E293B"/>
    <text x="30" y="215" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8">STANDARD: ISO/IEC 19505 UML 2.5</text>
  </g>

  <!-- Right: CDM & LDM Relational Model (3NF) -->
  <g transform="translate(315, 80)">
    <rect width="255" height="245" rx="12" fill="#182030" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="225" height="28" rx="6" fill="#1E293B"/>
    <text x="25" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">Relational Schemas &amp; 3NF</text>

    <!-- Entity Card A -->
    <rect x="20" y="55" width="98" height="85" rx="6" fill="#0F172A" stroke="#FB7185" stroke-width="1"/>
    <rect x="20" y="55" width="98" height="18" rx="6" fill="#FB7185"/>
    <text x="28" y="68" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#FFFFFF">ENT_SYSTEM</text>
    <text x="26" y="85" font-family="'JetBrains Mono', monospace" font-size="7" fill="#F43F5E">PK sys_code</text>
    <text x="26" y="98" font-family="'JetBrains Mono', monospace" font-size="7" fill="#E2E8F0">   domain_type</text>
    <text x="26" y="111" font-family="'JetBrains Mono', monospace" font-size="7" fill="#E2E8F0">   sla_target</text>
    <text x="26" y="124" font-family="'JetBrains Mono', monospace" font-size="7" fill="#94A3B8">   version</text>

    <!-- Entity Card B -->
    <rect x="138" y="55" width="98" height="85" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <rect x="138" y="55" width="98" height="18" rx="6" fill="#0284C7"/>
    <text x="146" y="68" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#FFFFFF">ENT_METRICS</text>
    <text x="144" y="85" font-family="'JetBrains Mono', monospace" font-size="7" fill="#38BDF8">PK metric_id</text>
    <text x="144" y="98" font-family="'JetBrains Mono', monospace" font-size="7" fill="#E2E8F0">FK sys_code</text>
    <text x="144" y="111" font-family="'JetBrains Mono', monospace" font-size="7" fill="#E2E8F0">   kpi_value</text>
    <text x="144" y="124" font-family="'JetBrains Mono', monospace" font-size="7" fill="#94A3B8">   timestamp</text>

    <!-- 1 to Many relationship line with crows foot -->
    <path d="M 118 95 H 138" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="120" cy="95" r="3" fill="#FB7185"/>

    <!-- Document formatting pill -->
    <rect x="20" y="155" width="216" height="72" rx="6" fill="#1E293B"/>
    <text x="30" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Academic Report Engineering</text>
    <text x="30" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">• Zotero Bibliography Sync &amp; Citation standard</text>
    <text x="30" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">• Automated Multilevel Heading &amp; TOC in MS Word</text>
    <text x="30" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#10B981">✓ 100% Institution Guideline Compliance</text>
