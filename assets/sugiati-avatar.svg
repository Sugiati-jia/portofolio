<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="50%" stop-color="#FFE4E6"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="roseRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2E"/>
      <stop offset="100%" stop-color="#2D122D"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FDA4AF"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F43F5E" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient background circle -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" />
  
  <!-- Subtle Tech Circuit Lines in background -->
  <path d="M 60 200 H 120 L 150 170 H 180" stroke="#FDA4AF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="60" cy="200" r="3" fill="#F43F5E" opacity="0.7"/>
  <circle cx="180" cy="170" r="3" fill="#F43F5E" opacity="0.7"/>

  <path d="M 340 180 H 280 L 250 210 H 220" stroke="#FDA4AF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="340" cy="180" r="3" fill="#F43F5E" opacity="0.7"/>
  <circle cx="220" cy="210" r="3" fill="#F43F5E" opacity="0.7"/>

  <!-- Glowing Rose Gold Outer Ring -->
  <circle cx="200" cy="200" r="182" stroke="url(#roseRing)" stroke-width="3" filter="url(#softShadow)" />

  <!-- Avatar Base (Shoulders & Elegant Blazer) -->
  <path d="M 90 380 C 95 320, 140 280, 200 280 C 260 280, 305 320, 310 380 Z" fill="url(#suitGrad)" />
  
  <!-- Rose Gold Lapel / Scarf Accent -->
  <path d="M 180 280 L 200 340 L 220 280 L 200 310 Z" fill="url(#goldAcc)" opacity="0.9"/>
  <path d="M 160 380 L 200 315 L 240 380 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Neck -->
  <path d="M 182 230 H 218 V 290 H 182 Z" fill="#FDE2D6" />

  <!-- Head Base -->
  <ellipse cx="200" cy="200" rx="55" ry="68" fill="#FFE8DF" />

  <!-- Elegant Hair Base -->
  <path d="M 140 190 C 135 120, 165 95, 200 95 C 235 95, 265 120, 260 190 C 265 240, 268 280, 260 310 C 248 315, 240 260, 240 230 C 240 150, 160 150, 160 230 C 160 260, 152 315, 140 310 C 132 280, 135 240, 140 190 Z" fill="url(#hairGrad)" />

  <!-- Soft Bangs / Side Parting -->
  <path d="M 148 160 C 165 130, 220 120, 252 165 C 235 150, 185 145, 148 160 Z" fill="#181524" />

  <!-- Eyes & Eyebrows (Minimalist & Smart) -->
  <path d="M 172 185 Q 183 180 194 185" stroke="#2D122D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="183" cy="194" r="4.5" fill="#2D122D" />
  <circle cx="185" cy="192" r="1.5" fill="#FFFFFF" />

  <path d="M 206 185 Q 217 180 228 185" stroke="#2D122D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="217" cy="194" r="4.5" fill="#2D122D" />
  <circle cx="219" cy="192" r="1.5" fill="#FFFFFF" />

  <!-- Chic Smart Glasses (Rose Gold Wireframe) -->
  <rect x="165" y="184" width="34" height="22" rx="7" stroke="#F43F5E" stroke-width="2" fill="rgba(255,255,255,0.25)"/>
  <rect x="201" y="184" width="34" height="22" rx="7" stroke="#F43F5E" stroke-width="2" fill="rgba(255,255,255,0.25)"/>
  <path d="M 199 192 H 201" stroke="#F43F5E" stroke-width="2"/>
  <path d="M 165 192 H 152" stroke="#F43F5E" stroke-width="1.8"/>
  <path d="M 235 192 H 248" stroke="#F43F5E" stroke-width="1.8"/>

  <!-- Soft Blush -->
  <ellipse cx="168" cy="212" rx="8" ry="4" fill="#FB7185" opacity="0.35"/>
  <ellipse cx="232" cy="212" rx="8" ry="4" fill="#FB7185" opacity="0.35"/>

  <!-- Subtle Smile -->
  <path d="M 191 228 Q 200 236 209 228" stroke="#E11D48" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Floating System Analyst Badge (Bottom Right) -->
  <g transform="translate(245, 260)">
    <rect width="130" height="42" rx="21" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="22" cy="21" r="12" fill="#FFF1F2"/>
    <text x="22" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#F43F5E">3.80</text>
    <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0F172A">GPA Honors</text>
    <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">System Analyst</text>
  </g>
</svg>
